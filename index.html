<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #f7e7ec;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CONTENEDOR DEL LIBRO */
.book {
    width: 320px;
    height: 450px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    position: relative;
}

/* PÁGINAS */
.page {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: none;
    text-align: center;
}

.page.active {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* TEXTO */
.text-page {
    padding: 25px;
}

h1 {
    color: #e75480;
    margin-bottom: 15px;
}

p {
    color: #333;
    font-size: 16px;
    line-height: 1.6;
}

/* PÁGINAS DE IMAGEN */
.image-page {
    padding: 0;
    background: #fff;
}

.image-page img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* AJUSTE PERFECTO */
}

/* BOTONES */
button {
    position: absolute;
    bottom: 15px;
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    background: #e75480;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.prev { left: 15px; }
.next { right: 15px; }
</style>
</head>

<body>

<div class="book">

    <!-- PRIMERA PÁGINA -->
    <div class="page text-page active">
        <h1>Para ti ❤️</h1>
        <p>
            Este pequeño librito guarda momentos,<br>
            recuerdos y sentimientos que nacen<br>
            de todo lo que siento por ti.
        </p>
    </div>

    <!-- 5 PÁGINAS CON IMÁGENES -->
    <div class="page image-page">
        <img src="img1.jpg" alt="Imagen 1">
    </div>

    <div class="page image-page">
        <img src="img2.jpg" alt="Imagen 2">
    </div>

    <div class="page image-page">
        <img src="img3.jpg" alt="Imagen 3">
    </div>

    <div class="page image-page">
        <img src="img4.jpg" alt="Imagen 4">
    </div>

    <div class="page image-page">
        <img src="img5.jpg" alt="Imagen 5">
    </div>

    <!-- ÚLTIMA PÁGINA -->
    <div class="page text-page">
        <h1>Te amo 💖</h1>
        <p>
            No importa el tiempo ni la distancia,<br>
            mi corazón siempre te elige.<br>
            Gracias por existir.
        </p>
    </div>

    <!-- BOTONES -->
    <button class="prev" onclick="prevPage()">◀</button>
    <button class="next" onclick="nextPage()">▶</button>

</div>

<script>
let currentPage = 0;
const pages = document.querySelectorAll('.page');

function showPage(index) {
    pages.forEach(p => p.classList.remove('active'));
    pages[index].classList.add('active');
}

function nextPage() {
    if (currentPage < pages.length - 1) {
        currentPage++;
        showPage(currentPage);
    }
}

function prevPage() {
    if (currentPage > 0) {
        currentPage--;
        showPage(currentPage);
    }
}
</script>

</body>
</html>
